<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tasks</title>
<style>
  :root {
    --paper: #F7F4EC;
    --ink: #23281F;
    --ink-soft: #5B5F52;
    --line: #D9D3C2;
    --accent: #8A6D3B;
    --accent-soft: #E8DEC8;
    --done: #9A9A8C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Iowan Old Style', 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }

  header {
    margin-bottom: 40px;
  }

  h1 {
    font-size: 40px;
    font-weight: 400;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }

  .sub {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0;
  }

  .add-row {
    display: flex;
    gap: 10px;
    margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px;
  }

  input[type="text"] {
    flex: 1;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: white;
    color: var(--ink);
    outline: none;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  button.add {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 20px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    cursor: pointer;
  }

  button.add:hover { opacity: 0.85; }
  button.add:disabled { opacity: 0.4; cursor: default; }

  ul { list-style: none; margin: 0; padding: 0; }

  li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }

  .check {
    width: 20px;
    height: 20px;
    min-width: 20px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }

  .check.done {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--paper);
    font-size: 12px;
  }

  .title {
    flex: 1;
    font-size: 18px;
  }

  .title.done {
    color: var(--done);
    text-decoration: line-through;
  }

  .remove {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
  }

  .remove:hover { color: var(--ink); }

  .empty {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 24px 0;
  }

  .status {
    margin-top: 40px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #7A9B6E;
  }

  .dot.down { background: #B4594F; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [tasks, setTasks] = useState([]);
  const [draft, setDraft] = useState("");
  const [apiUp, setApiUp] = useState(null);

  const loadTasks = () => {
    fetch("/tasks")
      .then(r => r.json())
      .then(setTasks)
      .catch(() => setApiUp(false));
  };

  useEffect(() => {
    fetch("/health")
      .then(r => r.ok ? setApiUp(true) : setApiUp(false))
      .catch(() => setApiUp(false));
    loadTasks();
  }, []);

  const addTask = (e) => {
    e.preventDefault();
    const title = draft.trim();
    if (!title) return;
    fetch("/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title })
    })
      .then(r => r.json())
      .then(newTask => {
        setTasks(prev => [...prev, newTask]);
        setDraft("");
      });
  };

  const removeTask = (id) => {
    fetch(`/tasks/${id}`, { method: "DELETE" })
      .then(() => setTasks(prev => prev.filter(t => t.id !== id)));
  };

  // Note: "done" is toggled only in the browser -- the API doesn't have an
  // update endpoint yet, so this resets if you reload the page.
  const [doneIds, setDoneIds] = useState([]);
  const toggleDone = (id) => {
    setDoneIds(prev =>
      prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
    );
  };

  return (
    <div className="wrap">
      <header>
        <h1>Tasks</h1>
        <p className="sub">A small list for a small day.</p>
      </header>

      <form className="add-row" onSubmit={addTask}>
        <input
          type="text"
          placeholder="Add something to do..."
          value={draft}
          onChange={e => setDraft(e.target.value)}
        />
        <button className="add" type="submit" disabled={!draft.trim()}>
          Add
        </button>
      </form>

      {tasks.length === 0 ? (
        <p className="empty">Nothing yet. Add your first task above.</p>
      ) : (
        <ul>
          {tasks.map(task => {
            const isDone = doneIds.includes(task.id);
            return (
              <li key={task.id}>
                <button
                  className={`check ${isDone ? "done" : ""}`}
                  onClick={() => toggleDone(task.id)}
                  aria-label="Toggle done"
                >
                  {isDone ? "✓" : ""}
                </button>
                <span className={`title ${isDone ? "done" : ""}`}>
                  {task.title}
                </span>
                <button className="remove" onClick={() => removeTask(task.id)}>
                  Remove
                </button>
              </li>
            );
          })}
        </ul>
      )}

      <div className="status">
        <span className={`dot ${apiUp === false ? "down" : ""}`}></span>
        {apiUp === null && "Checking API..."}
        {apiUp === true && "API connected"}
        {apiUp === false && "API unreachable"}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
